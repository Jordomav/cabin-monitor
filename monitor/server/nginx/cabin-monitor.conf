# Nginx site config for the CABIN Base Monitor.
# Drop in /etc/nginx/sites-available/cabin-monitor, symlink into
# /etc/nginx/sites-enabled/, then `sudo nginx -t && sudo systemctl reload nginx`.
#
# Replace <YOUR_DOMAIN> with the real hostname (e.g. cabin.example.com).
# Run certbot AFTER the HTTP-only block below is live so it can complete the
# ACME challenge over port 80:
#     sudo certbot --nginx -d <YOUR_DOMAIN>
# Certbot will rewrite this file in place, adding the SSL block / redirect.

# --- HTTP — redirects to HTTPS (certbot also leaves this in place for renewals)
server {
    listen 80;
    listen [::]:80;
    server_name <YOUR_DOMAIN>;

    # Certbot uses /.well-known/acme-challenge/ for renewals (default OK).
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS — main app (Node on 127.0.0.1:3000), HTTP/2, WS upgrade
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <YOUR_DOMAIN>;

    # Filled in by certbot. Until then, comment this block out + run certbot.
    ssl_certificate     /etc/letsencrypt/live/<YOUR_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<YOUR_DOMAIN>/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Reasonable hardening — adjust as needed.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;     # /update payloads are tiny; cap protectively
    proxy_read_timeout   3600s;  # don't close idle WebSocket connections

    # Single upstream — Node serves the Vue bundle, /api/*, /auth/*, /command,
    # /push/*, and the /ws upgrade all on the same port.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # WebSocket upgrade
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_cache_bypass                  $http_upgrade;
        proxy_buffering off;
    }
}

# Place this once at the http {} level in /etc/nginx/nginx.conf (or here works
# in newer Nginx). Maps Upgrade header so WS connections work.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
